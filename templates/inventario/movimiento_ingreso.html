{% extends 'base.html' %}

{% block content %}

<div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow border border-gray-100 mt-6">

    <div class="border-b pb-4 mb-6">

        <h2 class="text-2xl font-bold text-blue-800">
            Registrar Ingreso a Bodega
        </h2>

        <p class="text-sm text-gray-500 mt-1">
            Registre la entrada de repuestos o insumos al inventario.
        </p>

    </div>

    <form method="POST" class="space-y-5">

        {% csrf_token %}

        <!-- REPUESTO -->

        <div>

            <label class="block text-sm font-semibold text-gray-700 mb-2">
                Repuesto / Insumo
            </label>

            <select
                name="repuesto"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
            >

                <option value="">
                    Seleccione un repuesto
                </option>

                {% for repuesto in repuestos %}

                <option value="{{ repuesto.id }}">

                    {{ repuesto.nombre }}
                    — Código: {{ repuesto.codigo }}
                    — Stock actual: {{ repuesto.stock }}

                </option>

                {% endfor %}

            </select>

        </div>


        <!-- CANTIDAD -->

        <div>

            <label class="block text-sm font-semibold text-gray-700 mb-2">
                Cantidad ingresada
            </label>

            <input
                type="number"
                name="cantidad"
                min="1"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="Ejemplo: 10"
            >

        </div>


        <!-- OBSERVACIONES -->

        <div>

            <label class="block text-sm font-semibold text-gray-700 mb-2">
                Observaciones
            </label>

            <textarea
                name="observaciones"
                rows="4"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="Ejemplo: Compra a proveedor, reposición de stock, ingreso de nueva mercadería..."
            ></textarea>

        </div>


        <!-- BOTONES -->

        <div class="flex justify-end gap-3 border-t pt-5">

            <a
                href="{% url 'movimiento_list' %}"
                class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-5 rounded transition-colors"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-5 rounded shadow transition-colors"
            >
                Registrar Ingreso
            </button>

        </div>

    </form>

</div>

{% endblock %}
