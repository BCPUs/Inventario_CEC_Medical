{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow border border-gray-100 mt-6">
    <h2 class="text-2xl font-bold text-blue-800 mb-6 border-b pb-3">
        {{ title|default:"Registrar Nueva Herramienta" }}
    </h2>
    
    <form method="POST" class="space-y-5">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block font-semibold text-sm text-gray-700 mb-1.5">Código de Heramienta:</label>
                {{ form.codigo }}
            </div>
            <div>
                <label class="block font-semibold text-sm text-gray-700 mb-1.5">Nombre:</label>
                {{ form.nombre }}
            </div>
            <div>
                <label class="block font-semibold text-sm text-gray-700 mb-1.5">Marca de Fabricante:</label>
                {{ form.marca }}
            </div>
            <div>
                <label class="block font-semibold text-sm text-gray-700 mb-1.5">Estado Operativo:</label>
                {{ form.estado }}
            </div>
            <div class="md:col-span-2">
                <label class="block font-semibold text-sm text-gray-700 mb-1.5">Ubicación Física (Taller):</label>
                {{ form.ubicacion }}
            </div>
        </div>
        
        <div class="mt-8 flex justify-end space-x-3 border-t pt-4">
            <a href="{% url 'herramienta_list' %}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-5 rounded transition-colors text-sm">
                Cancelar
            </a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-800 text-white font-bold py-2 px-5 rounded transition-colors text-sm shadow-sm">
                Guardar Herramienta
            </button>
        </div>
    </form>
</div>
{% endblock %}
