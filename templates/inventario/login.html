{% extends 'base.html' %}
{% block title %}Iniciar Sesión - CEC Medical{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-lg shadow-md border border-gray-200">
    <h2 class="text-2xl font-bold text-center text-blue-800 mb-6">Control de Acceso</h2>

    {% if form.errors or form.non_field_errors %}
        <div class="mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-sm" role="alert">
            <span class="block font-medium text-center">Usuario o contraseña incorrectos.</span>
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Usuario:</label>
            <input type="text" name="username" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Contraseña:</label>
            <input type="password" name="password" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <button type="submit" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-2 px-4 rounded-md transition duration-200">
            Ingresar al Sistema
        </button>
    </form>
</div>
{% endblock %}
